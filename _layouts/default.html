---
layout: base
---
<div class="wrap page" data-component-name="page">
  {%- if page.title %}
  <h1 class="page__title">{{ page.title }}</h1>
  {%- endif %}
  {%- if page.lead %}
  <p class="lead">{{ page.lead }}</p>
  {%- endif %}
  <div class="prose{% if page.wide %} prose--wide{% endif %}">
    {{ content }}
  </div>
</div>
