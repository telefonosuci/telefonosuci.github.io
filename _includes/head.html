<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
{% seo %}
{%- if alt %}
<link rel="alternate" hreflang="{{ lang }}" href="{{ page.url | absolute_url }}">
<link rel="alternate" hreflang="{{ alt.lang }}" href="{{ alt.url | absolute_url }}">
<link rel="alternate" hreflang="x-default" href="{% if lang == site.lang %}{{ page.url | absolute_url }}{% else %}{{ alt.url | absolute_url }}{% endif %}">
{%- endif %}
<link rel="preload" href="{{ '/assets/fonts/inter.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

{%- if site.suci.sentry_loader and jekyll.environment == 'production' %}
<script src="{{ site.suci.sentry_loader }}" crossorigin="anonymous" async></script>
{%- endif %}
