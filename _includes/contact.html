<div class="contact">
  <div class="contact__form card">
    <script src="https://cdn.form.io/formiojs/formio.embed.js?src={{ site.suci.formio_contact }}&libs=true"></script>
  </div>
  <aside class="contact__aside">
    {{ include.aside | markdownify }}
    <p><a href="mailto:{{ site.email }}">{{ site.email }}</a></p>
    <p><a href="https://www.linkedin.com/{{ site.suci.social_links.linkedIn }}">LinkedIn</a> · <a href="https://github.com/{{ site.suci.social_links.github }}">GitHub</a></p>
  </aside>
</div>
