<div class="contact" data-component-name="contact-form">
  {%- include i18n.html -%}
  <form class="contact__form card" action="{{ site.suci.formspree_contact }}" method="POST">
    <label>{{ t.form.name }} <input name="name" autocomplete="name" required></label>
    <label>{{ t.form.email }} <input type="email" name="email" autocomplete="email" required></label>
    <label>{{ t.form.message }} <textarea name="message" rows="6" required></textarea></label>
    <label class="contact__check"><input type="checkbox" name="privacy" required> <span>{{ t.form.privacy }}</span></label>
    <input type="text" name="_gotcha" hidden tabindex="-1" autocomplete="off">
    <button class="btn" type="submit">{{ t.form.send }}</button>
  </form>
  <!-- ponytail: closedby="none" disables Esc natively; browsers without support still close on Esc. -->
  <dialog class="contact__dialog card" closedby="none">
    <p></p>
    <form method="dialog"><button class="btn">OK</button></form>
  </dialog>
  <script>
    // Submit via fetch so the visitor stays on the page instead of Formspree's thank-you page.
    document.querySelector('.contact__form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target, dialog = document.querySelector('.contact__dialog'), btn = form.querySelector('button');
      btn.disabled = true;
      let ok = false;
      try {
        ok = (await fetch(form.action, { method: 'POST', body: new FormData(form), headers: { Accept: 'application/json' } })).ok;
      } catch {}
      dialog.querySelector('p').textContent = ok ? {{ t.form.sent | jsonify }} : {{ t.form.error | jsonify }};
      dialog.showModal();
      if (ok) form.reset();
      btn.disabled = false;
    });
  </script>
  <aside class="contact__aside">
    {{ include.aside | markdownify }}
    <p><a href="mailto:{{ site.email }}">{{ site.email }}</a></p>
    <p><a href="https://github.com/{{ site.suci.social_links.github }}" target="_blank" rel="noopener">GitHub</a></p>
  </aside>
</div>
