<header class="site-header" data-component-name="site-header">
  <div class="wrap site-header__inner">
    <a class="brand" href="{{ t.home | relative_url }}">
      <span class="brand__mark" aria-hidden="true">ES</span>
      <span class="brand__name">Enrico Succhielli</span>
    </a>
    <nav class="site-nav" aria-label="Main">
      {%- for el in t.nav %}
      <a href="{{ el.url | relative_url }}">{{ el.name }}</a>
      {%- endfor %}
      <a class="lang-switch" lang="{% if lang == 'it' %}en{% else %}it{% endif %}"
         href="{% if alt %}{{ alt.url | relative_url }}{% elsif lang == 'it' %}{{ '/en/' | relative_url }}{% else %}{{ '/' | relative_url }}{% endif %}">{{ t.other_lang }}</a>
      <a class="btn btn--small" href="{{ t.contact_url | relative_url }}">{{ t.cta }}</a>
    </nav>
  </div>
</header>
