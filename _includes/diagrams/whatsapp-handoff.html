<figure class="diagram">
<svg viewBox="0 0 640 456" role="img" aria-label="Diagramma del passaggio di mano: l'assistente AI risponde; se serve una persona, perché lo chiede il cliente, per un reclamo, un ordine importante o un dubbio, il negoziante riceve un avviso con il riassunto e risponde nella stessa chat; altrimenti continua l'assistente">
<defs><marker id="wh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--muted)"/></marker></defs>
<rect x="120" y="1" width="400" height="64" rx="12"/><text x="320" y="29">L'assistente AI risponde</text><text class="sub" x="320" y="51">prodotti, taglie, spedizioni, resi</text>
<path class="line" d="M320 67 V121" marker-end="url(#wh)"/>
<rect x="60" y="125" width="520" height="64" rx="12" style="stroke-dasharray:5 5"/><text x="320" y="153">Serve una persona?</text><text class="sub" x="320" y="175">lo chiede il cliente · reclamo · ordine importante · dubbio</text>
<path class="line" d="M190 191 V251" marker-end="url(#wh)"/><text class="tag" x="174" y="226">no</text>
<path class="line" d="M450 191 V251" marker-end="url(#wh)"/><text class="tag" x="466" y="226">sì</text>
<rect x="20" y="255" width="280" height="64" rx="12"/><text x="160" y="283">Continua l'assistente</text><text class="sub" x="160" y="305">fino al link di pagamento</text>
<g class="hl"><rect x="340" y="255" width="280" height="64" rx="12"/><text x="480" y="283">Avviso al negoziante</text><text class="sub" x="480" y="305">con il riassunto della chat</text></g>
<path class="line" d="M480 321 V381" marker-end="url(#wh)"/>
<rect x="340" y="385" width="280" height="64" rx="12"/><text x="480" y="413">Risponde nella stessa chat</text><text class="sub" x="480" y="435">foto, video, videochiamata, carrello</text>
<path class="line dash" d="M622 417 H636 V33 H524" marker-end="url(#wh)"/>
</svg>
<figcaption>Quando l'assistente passa la mano. Il cliente resta nella stessa chat e non deve ripetere nulla: il negoziante legge il riassunto e riprende da lì. Finito, può ridare la chat all'assistente (freccia tratteggiata).</figcaption>
</figure>
