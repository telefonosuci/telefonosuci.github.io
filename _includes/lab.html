{%- include i18n.html -%}
{%- assign c = t.lab_controls -%}
<div class="lab" data-component-name="webgpu-lab">
  <canvas class="lab__canvas" data-lab-canvas></canvas>
  <p class="lab__fallback" data-lab-fallback hidden>{{ page.fallback }}</p>
</div>
<details class="lab-controls" data-component-name="lab-controls" open>
  <summary>{{ c.title }}</summary>
  <form class="lab-controls__grid" data-lab-controls>
    <label>{{ c.shape }}<select name="shape"><option value="cube">{{ c.cube }}</option><option value="sphere">{{ c.sphere }}</option></select></label>
    <label>{{ c.count }} <output></output><input type="range" name="count" min="64" max="4096" step="64" value="768"></label>
    <label>{{ c.size }} <output></output><input type="range" name="size" min="10" max="80" step="1" value="34"></label>
    <label>{{ c.radius }} <output></output><input type="range" name="radius" min="0.02" max="0.4" step="0.01" value="0.12"></label>
    <label>{{ c.force }} <output></output><input type="range" name="force" min="0" max="3" step="0.05" value="1"></label>
    <label>{{ c.bounce }} <output></output><input type="range" name="bounce" min="0" max="1" step="0.05" value="0.6"></label>
    <label>{{ c.damping }} <output></output><input type="range" name="damping" min="0.9" max="1" step="0.001" value="0.985"></label>
    <label>{{ c.flow }} <output></output><input type="range" name="flow" min="0" max="3" step="0.05" value="0.2"></label>
    <label>{{ c.max_speed }} <output></output><input type="range" name="maxSpeed" min="0.5" max="6" step="0.1" value="3"></label>
    <label class="lab-controls__color">{{ c.slow }} <input type="color" name="colA" value="#fca311"></label>
    <label class="lab-controls__color">{{ c.fast }} <input type="color" name="colB" value="#fdc14a"></label>
    <button class="btn btn--ghost" type="reset">{{ c.reset }}</button>
  </form>
</details>
<script src="{{ '/assets/js/lab-webgpu.js' | relative_url }}?v={{ site.time | date: '%s' }}" type="module"></script>
