{%- include i18n.html -%}
{%- assign c = t.lab_controls -%}
<div class="lab" data-component-name="webgpu-lab">
  <canvas class="lab__canvas" data-lab-canvas></canvas>
  <p class="lab__fallback" data-lab-fallback hidden>{{ page.fallback }}</p>
</div>
<details class="lab-controls" data-component-name="lab-controls" open>
  <summary class="lab-controls__summary">{{ c.title }}</summary>
  <form class="lab-controls__grid" data-lab-controls>
    <label class="lab-controls__field">{{ c.shape }}<select class="lab-controls__select" name="shape"><option value="cube">{{ c.cube }}</option><option value="sphere">{{ c.sphere }}</option></select></label>
    <label class="lab-controls__field">{{ c.count }} <output class="lab-controls__value"></output><input class="lab-controls__range" type="range" name="count" min="10" max="200" step="10" value="120"></label>
    <label class="lab-controls__field">{{ c.size }} <output class="lab-controls__value"></output><input class="lab-controls__range" type="range" name="size" min="10" max="80" step="1" value="50"></label>
    <label class="lab-controls__field">{{ c.radius }} <output class="lab-controls__value"></output><input class="lab-controls__range" type="range" name="radius" min="0.02" max="0.4" step="0.01" value="0.12"></label>
    <label class="lab-controls__field">{{ c.force }} <output class="lab-controls__value"></output><input class="lab-controls__range" type="range" name="force" min="0" max="3" step="0.05" value="1"></label>
    <label class="lab-controls__field">{{ c.bounce }} <output class="lab-controls__value"></output><input class="lab-controls__range" type="range" name="bounce" min="0" max="1" step="0.05" value="0.6"></label>
    <label class="lab-controls__field">{{ c.damping }} <output class="lab-controls__value"></output><input class="lab-controls__range" type="range" name="damping" min="0.9" max="1" step="0.001" value="0.985"></label>
    <label class="lab-controls__field">{{ c.flow }} <output class="lab-controls__value"></output><input class="lab-controls__range" type="range" name="flow" min="0" max="3" step="0.05" value="0.2"></label>
    <label class="lab-controls__field">{{ c.max_speed }} <output class="lab-controls__value"></output><input class="lab-controls__range" type="range" name="maxSpeed" min="0.5" max="6" step="0.1" value="3"></label>
    <label class="lab-controls__field lab-controls__field--color">{{ c.slow }} <input class="lab-controls__color" type="color" name="colA" value="#fca311"></label>
    <label class="lab-controls__field lab-controls__field--color">{{ c.fast }} <input class="lab-controls__color" type="color" name="colB" value="#fdc14a"></label>
    <button class="btn btn--ghost lab-controls__reset" type="reset">{{ c.reset }}</button>
  </form>
</details>
{% include script.html name="lab-webgpu" %}
