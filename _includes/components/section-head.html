{%- comment -%} Section heading. Params: title, lead (optional), eyebrow (optional), modifier (optional). {%- endcomment -%}
<header class="section-head {{ include.modifier }}" data-component-name="section-head" data-reveal>
  {%- if include.eyebrow %}<p class="eyebrow">{{ include.eyebrow }}</p>{% endif %}
  <h2 class="section-head__title">{{ include.title }}</h2>
  {%- if include.lead %}<p class="lead section-head__lead">{{ include.lead }}</p>{% endif %}
</header>
