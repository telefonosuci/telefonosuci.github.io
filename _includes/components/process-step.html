{%- comment -%} One phase of the work process, shown as a big panel. Params: it (title, text), n. {%- endcomment -%}
<div class="process-step" data-component-name="work-process-step">
  <span class="process-step__n" aria-hidden="true">{{ include.n }}</span>
  <h3 class="process-step__title">{{ include.it.title }}</h3>
  <p class="process-step__text">{{ include.it.text }}</p>
</div>
