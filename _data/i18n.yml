    canvas_label: An open cardboard parcel on a table, with a few things to ship and a tape gun next to it
    fallback: The game needs JavaScript and WebGL. The rules are below anyway.
    steps:
      - { id: fill, title: Fill., text: "Tap the items to put them in the parcel: the heaviest goes at the bottom." }
      - { id: fold, title: Close., text: "Fold the flaps: short ones first, then the long ones." }
      - { id: tape, title: Seal., text: Press on the lid and drag the gun along the seam. Let go to cut. }
    hints:
      fill_miss: Tap one of the items on the table.
      fill_order: "Heavy box first: it goes at the bottom."
      fold_miss: Tap one of the open flaps.
      flap_order: Short flaps first, or it won't hold.
      tape_miss: Press on the parcel's lid.
      tape_off_seam: "Off the seam: the tape goes along the middle line."
    end:
      title: Parcel shipped!
      verdicts: [Let's trust the courier., It'll get there in one piece., Straight out of the warehouse manual.]
    stats:
      - { id: coverage, label: Seam covered }
      - { id: tape, label: Tape used }
      - { id: mistakes, label: Mistakes }
      - { id: time, label: Time }
    restart: Another parcel
    reset: Start over
