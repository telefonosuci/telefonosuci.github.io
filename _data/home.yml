# Homepage content. Structure is in _includes/home.html; edit text here.
it:
  hero:
    eyebrow: Shopify Developer
    title: Metti ordine nelle tue vendite online, dal caos del catalogo all'ultimo pacco spedito.
    lead: >-
      Mi occupo di temi, app e integrazioni per Shopify e Shopify Plus.
      Collegare il negozio ai sistemi che usa già (ERP, PIM, CRM, marketplace,
      analytics), così smettono di litigare tra loro. E renderlo bello da
      guardare, che non guasta.
    cta: Parliamone
    secondary: Cosa faccio
    note: Ogni cubo è un pacco da spedire. Passaci sopra col mouse e mettili in fila. Il magazzino ringrazia.

  services:
    id: servizi
    title: Cosa faccio
    lead: Quattro competenze che di solito servono insieme, e che mi piace tenere unite.
    items:
      - icon: "⇄"
        title: Flussi ecommerce
        text: >-
          Prima dei pixel, i processi: catalogo e varianti, listini e prezzi B2B,
          promozioni, checkout, pagamenti, spedizioni, resi e post-vendita.
          Disegno il flusso dell'ordine end-to-end e trovo i punti dove si perdono
          vendite o tempo. Spoiler: di solito è un file Excel.
      - icon: "◆"
        title: Piattaforma Shopify
        text: >-
          Temi Online Store 2.0 su misura (Liquid, sezioni e blocchi), Shopify Plus,
          Checkout Extensibility e Shopify Functions, metafield e metaobject,
          Markets per multi-lingua e multi-valuta, app custom con Admin GraphQL API
          e webhook, migrazioni da altre piattaforme senza lasciare cadaveri per strada.
      - icon: "⛓"
        title: Integrazioni tra sistemi
        text: >-
          Shopify al centro, i dati dove servono: ERP, PIM, CRM, marketplace e social,
          strumenti di analytics. Sincronizzazioni robuste con code, retry,
          idempotenza e log, perché un ordine perso costa più di un'integrazione fatta bene.
          E perché "lo sistemo a mano il lunedì" non è un'architettura.
      - icon: "✦"
        title: Esperienze visive
        text: >-
          Tecniche grafiche avanzate, 3D di prodotto, configuratori e animazioni
          che fanno ricordare il brand. Belle, ma non al prezzo di una pagina
          che carica in otto secondi: i Core Web Vitals vengono prima dell'effetto wow.

  flow:
    title: Il viaggio di un ordine
    lead: >-
      Ogni negozio è una catena di sistemi, e una catena si rompe sempre
      nell'anello che nessuno guarda. Questo è il flusso tipico che progetto e
      integro: ogni passaggio è un punto dove i dati devono arrivare corretti e in tempo.
    steps:
      - title: Catalogo
        text: Schede prodotto, attributi e media arrivano dal PIM.
        systems: PIM → Shopify
      - title: Prezzi e giacenze
        text: Listini, disponibilità e regole B2B sincronizzati dall'ERP.
        systems: ERP → Shopify
      - title: Vetrina
        text: Tema veloce, ricerca, filtri, merchandising ed esperienze visive.
        systems: Shopify
      - title: Checkout
        text: Pagamenti, sconti e logiche custom con Functions ed estensioni.
        systems: Shopify Checkout
      - title: Ordine e fulfillment
        text: L'ordine va al gestionale, il tracking torna al cliente. Senza passare dalla scrivania di nessuno.
        systems: Shopify ⇄ ERP / WMS
      - title: Cliente e marketing
        text: Profili, segmenti e automazioni nel CRM e nell'email marketing.
        systems: Shopify → CRM
      - title: Misurazione
        text: Eventi affidabili lato client e server, per decidere sui dati e non sulle sensazioni.
        systems: GA4 · GTM · CAPI

  integrations:
    id: integrazioni
    title: Integrazioni
    lead: >-
      Esempi delle famiglie di sistemi che collego a Shopify: via app pubbliche
      quando bastano, via middleware o app custom quando servono regole su misura.
      Se un'app da 9 $/mese risolve, meglio quella.
    groups:
      - title: ERP e gestionali
        items: [SAP, Microsoft Dynamics, Odoo, gestionali italiani]
      - title: PIM
        items: [Akeneo, Pimcore, feed CSV / XML]
      - title: CRM e marketing
        items: [Salesforce, HubSpot, Klaviyo]
      - title: Social e marketplace
        items: [Meta / Instagram Shop, Google Merchant Center, TikTok, Amazon]
      - title: Analytics e tracking
        items:
          [
            GA4,
            Google Tag Manager,
            server-side tagging,
            Meta Conversions API,
            Shopify Web Pixels,
          ]
      - title: Come le realizzo
        items:
          [
            Admin GraphQL API,
            webhook,
            code e retry,
            app custom,
            serverless,
            "iPaaS (Make, n8n)",
          ]

  process:
    title: Il mio metodo
    steps:
      - title: Analisi
        text: Capisco obiettivi, processi e sistemi esistenti, anche quelli di cui nessuno ricorda la password. Ne esce una mappa dei flussi e delle priorità.
      - title: Progetto
        text: Architettura e integrazioni decise prima di scrivere codice. Niente sorprese a metà strada.
      - title: Sviluppo
        text: Rilasci incrementali su staging, codice versionato e documentato. Il venerdì pomeriggio non si va in produzione.
      - title: Go-live e supporto
        text: Lancio monitorato, documentazione e miglioramento continuo. Il progetto non finisce il giorno del lancio.

  lab:
    title: Lab grafico
    text: >-
      Mi piace spingere il browser al limite, e ogni tanto oltre. Nel lab trovi
      esperimenti grafici interattivi. Ventola del portatile avvisata.
    cta: Apri il lab

  about:
    title: Chi sono
    text: >-
      Sono Suci, sviluppatore web con la fissa del dettaglio.
      Unisco la parte meno visibile dell'ecommerce (dati, processi, integrazioni)
      con la cura dell'interfaccia e della grafica. Questo sito è il mio
      laboratorio: qui raccolgo esperimenti, appunti e quello che imparo sul campo.
      Sono specializzato in ecommerce e CMS, ma non solo: oltre a Shopify lavoro
      con WordPress e Strapi, ho competenze avanzate di frontend, in particolare con React,
      e sviluppo agenti AI e integrazioni con piattaforme di messaggistica.
    motto:
      text: In Okinawa, programming is a serious thing.
      cite: Mr. Miyagi
      note: >-
        Il codice, come il karate, non si fa "un po'": o lo fai bene, o non lo fai.
        Si può ridere di tutto, ma un ordine perso, un checkout che si blocca o un
        dato sbagliato non fanno ridere nessuno. Leggerezza nei modi, rigore nel lavoro.

  contact:
    title: Parliamo di Shopify?
    text: Una domanda tecnica, un'idea da confrontare, un'integrazione che non torna. Scrivimi, rispondo volentieri. Con onestà, anche quando la risposta è "non ti serve".
    cta: Scrivimi

en:
  hero:
    eyebrow: Shopify Developer
    title: Bring order to your online sales, from catalog chaos to the last parcel shipped.
    lead: >-
      I work on themes, apps and integrations for Shopify and Shopify Plus.
      Connecting a store to the systems it already uses (ERP, PIM, CRM,
      marketplaces, analytics) so they stop arguing with each other. And making
      it look good, which never hurts.
    cta: Let's talk
    secondary: What I do
    note: Every cube is a parcel to ship. Sweep your mouse over them and line them up. The warehouse thanks you.

  services:
    id: services
    title: What I do
    lead: Four skills that are usually needed together, and that I like to keep together.
    items:
      - icon: "⇄"
        title: Ecommerce flows
        text: >-
          Processes before pixels: catalog and variants, price lists and B2B pricing,
          promotions, checkout, payments, shipping, returns and after-sales.
          I map the order flow end-to-end and find where sales or time get lost.
          Spoiler: it's usually a spreadsheet.
      - icon: "◆"
        title: Shopify platform
        text: >-
          Custom Online Store 2.0 themes (Liquid, sections and blocks), Shopify Plus,
          Checkout Extensibility and Shopify Functions, metafields and metaobjects,
          Markets for multi-language and multi-currency, custom apps with the
          Admin GraphQL API and webhooks, migrations from other platforms without
          leaving bodies along the way.
      - icon: "⛓"
        title: System integrations
        text: >-
          Shopify at the center, data where it's needed: ERP, PIM, CRM, marketplaces
          and social, analytics tools. Robust syncs with queues, retries,
          idempotency and logging, because a lost order costs more than a well-built integration.
          And because "I'll fix it by hand on Monday" is not an architecture.
      - icon: "✦"
        title: Visual experiences
        text: >-
          Advanced graphics techniques, product 3D, configurators and animations
          that make the brand stick. Beautiful, but not at the cost of a page
          that takes eight seconds to load: Core Web Vitals come before the wow effect.

  flow:
    title: The journey of an order
    lead: >-
      Every store is a chain of systems, and a chain always breaks at the link
      nobody is watching. This is the typical flow I design and integrate: each
      step is a place where data must arrive correct and on time.
    steps:
      - title: Catalog
        text: Product data, attributes and media come from the PIM.
        systems: PIM → Shopify
      - title: Prices and stock
        text: Price lists, availability and B2B rules synced from the ERP.
        systems: ERP → Shopify
      - title: Storefront
        text: Fast theme, search, filters, merchandising and visual experiences.
        systems: Shopify
      - title: Checkout
        text: Payments, discounts and custom logic with Functions and extensions.
        systems: Shopify Checkout
      - title: Order and fulfillment
        text: The order goes to the back office, tracking goes back to the customer. Without stopping at anyone's desk.
        systems: Shopify ⇄ ERP / WMS
      - title: Customer and marketing
        text: Profiles, segments and automations in the CRM and email marketing.
        systems: Shopify → CRM
      - title: Measurement
        text: Reliable client and server-side events, so decisions run on data, not gut feeling.
        systems: GA4 · GTM · CAPI

  integrations:
    id: integrations
    title: Integrations
    lead: >-
      Examples of the system families I connect to Shopify: through public apps
      when they're enough, through middleware or custom apps when you need your own rules.
      If a $9/month app does the job, that's the better choice.
    groups:
      - title: ERP and back office
        items: [SAP, Microsoft Dynamics, Odoo, Italian ERPs]
      - title: PIM
        items: [Akeneo, Pimcore, CSV / XML feeds]
      - title: CRM and marketing
        items: [Salesforce, HubSpot, Klaviyo]
      - title: Social and marketplaces
        items: [Meta / Instagram Shop, Google Merchant Center, TikTok, Amazon]
      - title: Analytics and tracking
        items:
          [
            GA4,
            Google Tag Manager,
            server-side tagging,
            Meta Conversions API,
            Shopify Web Pixels,
          ]
      - title: How I build them
        items:
          [
            Admin GraphQL API,
            webhooks,
            queues and retries,
            custom apps,
            serverless,
            "iPaaS (Make, n8n)",
          ]

  process:
    title: My approach
    steps:
      - title: Discovery
        text: I learn your goals, processes and existing systems, including the ones nobody remembers the password for. The output is a map of flows and priorities.
      - title: Design
        text: Architecture and integrations settled before writing code. No surprises halfway through.
      - title: Build
        text: Incremental releases on staging, versioned and documented code. We don't deploy on Friday afternoon.
      - title: Launch and support
        text: Monitored go-live, documentation and continuous improvement. The project doesn't end on launch day.

  lab:
    title: Graphics lab
    text: >-
      I like pushing the browser to its limits, and occasionally past them. In
      the lab you'll find interactive graphics experiments. Your laptop fan has been warned.
    cta: Open the lab

  about:
    title: About me
    text: >-
      I'm Suci, a web developer obsessed with details. I combine the
      less visible side of ecommerce (data, processes, integrations) with care
      for interface and graphics. This site is my lab: experiments, notes and
      what I learn in the field.
      I specialize in ecommerce and CMS, but not only: beyond Shopify I work
      with WordPress and Strapi, I have advanced frontend skills, especially with React,
      and I build AI agents and integrations with messaging platforms.
    motto:
      text: In Okinawa, programming is a serious thing.
      cite: Mr. Miyagi
      note: >-
        Code, like karate, isn't something you do "kind of": you either do it right
        or you don't do it at all. You can joke about anything, but a lost order, a
        stuck checkout or bad data aren't funny to anyone. Light in manner, rigorous in work.

  contact:
    title: Let's talk Shopify?
    text: A technical question, an idea to bounce around, an integration that doesn't add up. Write to me, I'm happy to reply. Honestly, even when the answer is "you don't need it".
    cta: Write to me
