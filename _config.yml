title: SUCI · Shopify Developer
description: >-
  Sviluppatore Shopify freelance: temi, app, flussi ecommerce e integrazioni
  con ERP, PIM, CRM, social e analytics. Esperienze visive in WebGL e WebGPU.
url: https://telefonosuci.github.io
baseurl: ""
lang: it
author: Enrico Succhielli
email: telefonosuci@gmail.com
show_excerpts: true

suci:
  name: SUCI
  tagline: Shopify Developer · ecommerce, integrazioni, WebGL
  # Partita IVA: obbligatoria sul sito per i professionisti in Italia. Compila e verrà mostrata nel footer.
  vat: ""
  date_format: "%d/%m/%Y"
  disqus_shortname: telefonosuci
  gtm_id: GTM-TP92MWJ
  sentry_loader: https://js.sentry-cdn.com/47580faa06234c8a1655108d106bdcc2.min.js
  formspree_contact: https://formspree.io/f/xzedyede
  social_links:
    github: telefonosuci
    linkedIn: in/enrico-succhielli
    twitter: enricolebanane

sass:
  sass_dir: _sass
  style: compressed

defaults:
  - scope: { path: "_posts/it", type: posts }
    values: { lang: it, layout: post, permalink: "/blog/:slug/" }
  - scope: { path: "_posts/en", type: posts }
    values: { lang: en, layout: post, permalink: "/en/blog/:slug/" }

plugins:
  - jekyll-seo-tag
  - jekyll-redirect-from

exclude:
  - README.md
  - RUNNING_LOCAL.md
  - TODO.md
  - LICENSE.txt
  - Gemfile
  - Gemfile.lock
  - "*.code-workspace"
  - vendor
  - node_modules
  - package.json
  - package-lock.json
