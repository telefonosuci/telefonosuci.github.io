title: SUCI · Shopify Developer
description: >-
  Sviluppatore Shopify: temi, app, flussi ecommerce e integrazioni
  con ERP, PIM, CRM, social e analytics. Esperienze visive curate.
url: https://telefonosuci.github.io
baseurl: ""
lang: it
author: SUCI
email: telefonosuci@gmail.com
show_excerpts: true

suci:
  name: SUCI
  tagline: Shopify Developer · ecommerce, integrazioni, grafica
  # Partita IVA: vuota = non mostrata (prestazione occasionale con ritenuta). Se la apri, compilala: diventa obbligatoria e comparirà in footer e privacy.
  vat: ""
  date_format: "%d/%m/%Y"
  disqus_shortname: telefonosuci
  # Caricato solo dopo il consenso cookie (vedi _includes/consent.html). Vuoto = niente GA né banner.
  ga_id: G-NDPZWH3DY1
  consent:
    # Giorni di validità della scelta (accetta o rifiuta). Il Garante chiede di non riproporre il banner prima di 6 mesi.
    max_age_days: 180
    # Incrementa quando cambiano i cookie usati (es. nuovi tag): il banner ricompare a tutti.
    version: 1
  sentry_loader: https://js.sentry-cdn.com/47580faa06234c8a1655108d106bdcc2.min.js
  formspree_contact: https://formspree.io/f/xzedyede
  social_links:
    github: telefonosuci

sass:
  sass_dir: _sass
  style: compressed

defaults:
  - scope: { path: "_posts/it", type: posts }
    values: { lang: it, layout: post, permalink: "/blog/:slug/" }
  - scope: { path: "_posts/en", type: posts }
    values: { lang: en, layout: post, permalink: "/en/blog/:slug/" }

plugins:
  - jekyll-seo-tag
  - jekyll-redirect-from

exclude:
  - README.md
  - RUNNING_LOCAL.md
  - TODO.md
  - LICENSE.txt
  - Gemfile
  - Gemfile.lock
  - "*.code-workspace"
  - vendor
  - node_modules
  - package.json
  - package-lock.json
